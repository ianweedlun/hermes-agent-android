build:
  maxIssues: 0
  excludeCorrectable: false

complexity:
  CyclomaticComplexMethod:
    threshold: 15
  LongMethod:
    threshold: 60
  LargeClass:
    threshold: 400

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true

potential-bugs:
  UnsafeCallOnNullableType:
    active: true

style:
  MaxLineLength:
    maxLineLength: 120
  MagicNumber:
    active: false
  WildcardImport:
    active: true
